spring.application.name=investment-portfolio-tracker
app.version=@project.version@

# Port: hosting platforms (Render) set the PORT environment variable. Locally it defaults to 8080.
server.port=${PORT:8080}
# Render terminates HTTPS in front of the app; trust its forwarded headers so redirects keep https.
server.forward-headers-strategy=framework

# Where transactions.csv and prices.csv are stored.
# Locally: ./data. On Render: set PORTFOLIO_DATA_DIR to the persistent disk's mount path.
portfolio.data-dir=${PORTFOLIO_DATA_DIR:./data}

# Template caching is off for local development; the Docker image turns it on.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
